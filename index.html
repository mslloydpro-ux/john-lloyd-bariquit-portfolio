@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F4F4ED}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.app{height:100%;display:grid;grid-template-columns:288px 1fr}
aside{border-right:1px solid var(--line);background:#F8F8F3;padding:28px 24px;display:flex;flex-direction:column;min-height:0}
.me{text-align:center}
.pic{width:148px;height:148px;margin:0 auto 14px;border-radius:50%;background:var(--face) center/cover;border:4px solid #fff;box-shadow:0 0 0 2px var(--acc),0 14px 30px -12px #0B1E3F66}
.me h2{font-size:1.25rem;font-weight:700;display:flex;justify-content:center;align-items:center;gap:6px}
.me h2 svg{width:18px;height:18px}
.me p{font-size:.82rem;color:var(--mute)}
.soc{display:flex;justify-content:center;gap:10px;margin:16px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.soc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700;transition:.2s}
.soc a:hover{background:var(--ink);color:#fff;transform:translateY(-2px)}
nav{display:grid;gap:4px}
nav button{display:flex;gap:12px;align-items:center;padding:11px 14px;border:0;border-radius:12px;background:none;font-weight:500;font-size:.92rem;text-align:left;color:var(--mute);transition:.2s}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:#0B1E3F0d;color:var(--ink)}
nav button.on{background:#0B1E3F14;color:var(--ink);font-weight:600}
.foot{margin-top:auto;font-size:.75rem;color:var(--mute);padding-top:12px;border-top:1px solid var(--line)}
main{padding:24px 32px 28px;display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);min-height:0;min-width:0;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
h1{font-size:min(4.2vw,7.6vh);font-weight:800;letter-spacing:-.03em;line-height:1.08}
h1 em{font-style:normal;color:var(--acc)}
.lead{color:var(--mute);font-size:min(1.05rem,2.3vh);max-width:62ch;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--ink);color:#fff;border:2px solid var(--ink);font-weight:600;font-size:.88rem;white-space:nowrap;transition:.2s}
.btn:hover{background:var(--acc);border-color:var(--acc);transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{color:#fff}
.tools{display:flex;align-items:center;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 22px;box-shadow:0 0 0 7px #c9d6fb55}
.tools b{font-size:.9rem;line-height:1.2;flex:none}
.mq{flex:1;overflow:hidden;min-width:0;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tr{display:flex;gap:40px;width:max-content;animation:sc 24s linear infinite}
.mq:hover .tr{animation-play-state:paused}
.tr span{display:flex;gap:9px;align-items:center;font-weight:600;font-size:.9rem;white-space:nowrap}
.tr svg{width:22px;height:22px}
@keyframes sc{to{transform:translateX(-50%)}}
.bento{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px;border-radius:28px;background:linear-gradient(135deg,#dfe6fb,#c9d6fb 60%,#dfe6fb)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 34px -18px #0B1E3F77}
.tile.w{grid-column:span 2}
.th{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.ic{width:34px;height:34px;border-radius:11px;background:var(--acc);display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile small{display:block;color:var(--mute);font-size:.78rem;margin-top:6px}
.prev{margin-top:12px;flex:1;min-height:166px;padding:10px;border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;background:radial-gradient(ellipse at 8% 100%,#ffdfc7 0,transparent 48%),linear-gradient(135deg,#e8eefb,#f8f8f4 68%,#fff)}
.projects-preview-grid{display:grid;grid-template-columns:minmax(0,1.17fr) minmax(0,.83fr);gap:9px;flex:1;min-height:0}
.projects-window{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid #0B1E3F20;border-radius:11px;background:#fff;box-shadow:0 5px 14px #0B1E3F18}
.projects-window--main{display:block}
.projects-browser-bar{position:absolute;top:0;left:0;right:0;z-index:2;height:22px;display:flex;align-items:center;gap:3px;padding:0 8px;background:#fff;border-bottom:1px solid #0B1E3F12;color:#0B1E3F88;font-size:.48rem;font-weight:600;letter-spacing:.05em;white-space:nowrap;overflow:hidden}
.projects-browser-dot{width:5px;height:5px;flex:none;border-radius:50%;background:#FF7A1A}
.projects-browser-dot:nth-child(2){background:#0B1E3F30}.projects-browser-dot:nth-child(3){background:#0B1E3F18}
.projects-browser-title{margin-left:5px;overflow:hidden;text-overflow:ellipsis}
.projects-window img{position:absolute;top:22px;left:0;display:block;width:100%;height:calc(100% - 22px);min-height:0;object-fit:cover;object-position:center 18%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.projects-category{position:absolute;left:7px;bottom:7px;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid #0B1E3F12;border-radius:999px;background:#ffffffed;color:#0B1E3F;font-size:.55rem;line-height:1.2;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px #0B1E3F20;backdrop-filter:blur(8px)}
.projects-category::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.projects-preview-side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:9px;min-width:0;min-height:0}
.projects-window--mini{display:block}
.projects-window--mini .projects-browser-bar{height:18px;padding:0 6px;font-size:.43rem}
.projects-window--mini img{top:18px;height:calc(100% - 18px);object-position:center 25%}
.projects-window--mini .projects-category{left:6px;bottom:5px;padding:3px 6px;font-size:.49rem}
.projects-flow{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px 6px;border:1px solid #ffffff18;border-radius:11px;background:linear-gradient(145deg,#142c50,#0B1E3F);color:#fff;box-shadow:0 5px 14px #0B1E3F20}
.projects-flow-head{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:.48rem;line-height:1.2;font-weight:700;letter-spacing:.055em;color:#fff}
.projects-flow-sample{color:#ffffff9c;font-size:.43rem;font-weight:500;letter-spacing:0;white-space:nowrap}
.projects-flow svg{display:block;width:100%;height:36px;min-height:24px;overflow:visible}
.projects-flow path{fill:none;stroke:#FF9A50;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.projects-flow rect{fill:#fff;stroke:#ffffff30;stroke-width:1}
.projects-flow text{fill:#0B1E3F;font-family:'Poppins',system-ui,sans-serif;font-size:6px;font-weight:600}
.projects-preview-footer{display:flex;justify-content:flex-end;align-items:center;min-height:22px;padding:0 2px}
.projects-explore{display:inline-flex;align-items:center;gap:7px;color:#0B1E3F;font-size:.69rem;font-weight:700;line-height:1.2}
.projects-explore-icon{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;transition:transform .25s,background .25s}
.projects-explore-icon svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.w:hover .projects-window img{transform:scale(1.045)}
.tile.w:hover .projects-explore-icon{transform:translateX(3px);background:#e9650b}
.face{margin-top:10px;flex:1;min-height:0;border-radius:14px;background:var(--face) center/cover}
.list{margin-top:8px;display:grid;font-size:.8rem;font-weight:500}
.list span{padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.list span:last-child{border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips i{font-style:normal;font-size:.75rem;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:#fff}
.tile.ct{background:var(--ink);color:#fff}.tile.ct small{color:#ffffffaa}
.tile.ct .big{font-size:1.15rem;font-weight:700;margin-top:10px;line-height:1.25}
/* panels */
.ov{position:fixed;inset:0;z-index:20;background:#0B1E3F88;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.pn{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--bg);border-radius:28px;padding:34px;position:relative;transform:translateY(24px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.show .pn{transform:none}
.x{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem}
.x:hover{background:var(--acc);color:#fff}

function setupGalleries(root) {
root.querySelectorAll(".gallery").forEach(function(gallery) {
const viewport = gallery.querySelector(".gallery-viewport");
const track = gallery.querySelector(".gallery-track");
const firstCopy = gallery.querySelector(".gallery-copy");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFrame = 0, resumeAt = 0, hovered = false, pointerActive = false, dragging = false, moved = false, suppressClick = false, startX = 0, startScroll = 0;
const pause = function(ms) { resumeAt = performance.now() + (ms || 2400); };
const move = function(direction) {
pause(2800);
const max = Math.max(0, track.scrollWidth - viewport.clientWidth);
let target = viewport.scrollLeft + direction * Math.max(260, viewport.clientWidth * .82);
if (target < 0) target = max;
if (target > max) target = 0;
viewport.scrollTo({left:target, behavior:reducedMotion ? "auto" : "smooth"});
};
const frame = function(now) {
if (!gallery.isConnected) return;
if (!lastFrame) lastFrame = now;
const delta = Math.min(50, now - lastFrame);
lastFrame = now;
if (ov.classList.contains("show") && !lbx.classList.contains("show") && !reducedMotion && !hovered && !pointerActive && !dragging && !gallery.matches(":focus-within") && now > resumeAt) {
viewport.scrollLeft += 54 * delta / 1000;
const cycle = firstCopy.getBoundingClientRect().width;
if (cycle > 0 && viewport.scrollLeft >= cycle) viewport.scrollLeft -= cycle;
}
requestAnimationFrame(frame);
};
gallery.querySelectorAll(".gallery-arrow").forEach(function(button) {
button.addEventListener("click", function() { move(Number(button.dataset.direction)); });
});
gallery.addEventListener("pointerenter", function(event) { if (event.pointerType === "mouse") hovered = true; });
gallery.addEventListener("pointerleave", function(event) { if (event.pointerType === "mouse") { hovered = false; pause(700); } });
gallery.addEventListener("focusin", function() { pause(2500); });
gallery.addEventListener("focusout", function(event) { if (!gallery.contains(event.relatedTarget)) pause(900); });
gallery.addEventListener("wheel", function() { pause(2400); }, {passive:true});
viewport.addEventListener("keydown", function(event) {
if (event.key === "ArrowLeft" || event.key === "ArrowRight") { event.preventDefault(); move(event.key === "ArrowLeft" ? -1 : 1); }
});
viewport.addEventListener("pointerdown", function(event) {
pause(2400); pointerActive = true;
if (event.pointerType !== "mouse" || event.button !== 0) return;
dragging = true; moved = false; startX = event.clientX; startScroll = viewport.scrollLeft;
viewport.classList.add("is-dragging");
viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener("pointermove", function(event) {
if (!dragging) return;
const distance = event.clientX - startX;
if (Math.abs(distance) > 5) moved = true;
if (moved) { event.preventDefault(); viewport.scrollLeft = startScroll - distance; }
});
const endDrag = function(event) {
pointerActive = false;
if (!dragging) { pause(1200); return; }
dragging = false;
viewport.classList.remove("is-dragging");
if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
if (moved) { suppressClick = true; window.setTimeout(function() { suppressClick = false; }, 80); }
pause(1800);
};
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
viewport.querySelectorAll(".gallery-image").forEach(function(button) {
button.addEventListener("click", function(event) {
if (!suppressClick) return;
event.preventDefault(); event.stopImmediatePropagation(); suppressClick = false;
});
});
requestAnimationFrame(frame);
});
}
